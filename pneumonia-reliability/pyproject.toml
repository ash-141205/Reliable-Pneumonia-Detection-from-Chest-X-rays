[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pneumreliab"
version = "1.0.0"
description = "Reliable pneumonia detection from chest X-rays: patient-level splits, calibration, abstention, shortcut audit"
requires-python = ">=3.9"
dependencies = ["torch", "torchvision", "numpy", "scipy", "scikit-learn", "pillow", "matplotlib"]

[project.optional-dependencies]
app = ["streamlit"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
